## 앱 고유 설정 파일
# AI 기능 (LLM, TTS, STT, Wakeword)
# 기본 음성 경로: Whisper → GPT-4o mini → Google Cloud TTS (캐스케이드)
llm:
  type: 0                            # 0:ChatGPT  1:ModuleLLM  2:ModuleLLM(Function Calling)
  model: "gpt-4o-mini"
  enableMemory: true

tts:
  type: 5                            # 0:VOICEVOX  1:ElevenLabs  2:OpenAI TTS  3:AquesTalk  4:ModuleLLM  5:Google Cloud TTS
  model: ""
  voice: "ko-KR-Wavenet-A"           # Google Cloud TTS 한국어 WaveNet. 영어 위주 문장은 en-US-Wavenet-C로 자동 전환
  #voice: "3"                         # VOICEVOX (ずんだもん)
  #voice: "AZnzlk1XvdvUeBnXmlld"      # ElevenLabs
  #voice: "alloy"                     # OpenAI TTS

stt:
  type: 1                            # 0:Google STT  1:OpenAI Whisper  2:ModuleLLM(ASR)  3:ModuleLLM(Whisper)

wakeword:
  type: 0                            # 0:SimpleVox  1:ModuleLLM(KWS)
  keyword: ""                        # SimpleVox (초기설정 불가. 버튼 B 길게 눌러 등록)
  #keyword: "HI STUCK"                # ModuleLLM(KWS)

# ModuleLLM
moduleLLM:
  # Serial Pin
  # Core2 Rx:13,Tx:14
  # CoreS3 Rx:18,Tx:17
  rxPin: 18
  txPin: 17
